[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sector-research-mcp"
version = "0.1.0"
description = "MCP server for generating standardized sector market-research memos (Stablecoins & Payment Rails, AI Infrastructure, AI Consumer, Market Infrastructure)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "likashingloban" }]
keywords = ["mcp", "market-research", "venture-capital", "stablecoins", "ai-infrastructure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "markdown>=3.5",
    "python-docx>=1.1",
    "htmldocx>=0.0.6",
    "xhtml2pdf>=0.2.11",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sector-research-mcp = "sector_research_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/likashingloban/likashingloban/tree/main/sector-research-mcp"
Repository = "https://github.com/likashingloban/likashingloban"

[tool.hatch.build.targets.wheel]
packages = ["src/sector_research_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
